<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto SkyCar - Contact Us</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <h1>Contact Auto SkyCar</h1>

    <nav>
      <ul>
        <li><a href="about.html">About Us</a> |</li>
        <li><a href="index.html">Back to Cars for Sale </a></li>
      </ul>
    </nav>

    <main class="main-form">
      <p>Feel free to reach out to us with any questions or inquiries!</p>

      <form>
        <h3>Contact Form</h3>
        <label for="name">Name:</label>
        <input type="text" id="name" class="form-input" name="name" required />

        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          class="form-input"
          name="email"
          required
        />

        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit" id="send-form" class="form-submit">
          Send Message
        </button>
      </form>
    </main>
  </body>
</html>
